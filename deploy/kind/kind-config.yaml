# kind cluster configuration for local Tollbooth development.
#
# Features:
# - Single control-plane node (sufficient for dev).
# - Ingress-ready: port 80 and 443 mapped to host so you can access
#   services via localhost without port-forward.
# - Extra label on control-plane node for ingress controller targeting.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # HTTP – maps host :80 to node :80 for Ingress
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      # HTTPS – maps host :443 to node :443 for Ingress
      - containerPort: 443
        hostPort: 443
        protocol: TCP
      # NodePort range for debugging (optional)
      - containerPort: 30000
        hostPort: 30000
        protocol: TCP
