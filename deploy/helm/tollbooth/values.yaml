# ─────────────────────────────────────────────────────────────
# Tollbooth – Default Values
# ─────────────────────────────────────────────────────────────
# These are base defaults. Override with values-local.yaml or
# values-prod.yaml for environment-specific settings.

global:
  namespace: tollbooth
  imagePullPolicy: IfNotPresent

# ── Gateway ─────────────────────────────────────────────────
gateway:
  enabled: true
  replicaCount: 1
  image:
    repository: tollbooth/gateway
    tag: dev
  port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  env: {}

# ── woo-mcp ────────────────────────────────────────────────
woo-mcp:
  enabled: true
  replicaCount: 1
  image:
    repository: tollbooth/woo-mcp
    tag: dev
  port: 8081
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  env: {}

# ── Dashboard ───────────────────────────────────────────────
dashboard:
  enabled: true
  replicaCount: 1
  image:
    repository: tollbooth/dashboard
    tag: dev
  port: 8080
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# ── PostgreSQL ──────────────────────────────────────────────
postgres:
  enabled: true
  image:
    repository: postgres
    tag: "16-alpine"
  port: 5432
  storage:
    size: 1Gi
    storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# ── Store (WordPress + MariaDB) ────────────────────────────
store:
  enabled: false  # disabled by default, enable per-environment
  wordpress:
    image:
      repository: wordpress
      tag: "6.7-php8.3-apache"
    port: 80
    storage:
      size: 1Gi
      storageClass: ""
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
  mariadb:
    image:
      repository: mariadb
      tag: "11.6"
    port: 3306
    storage:
      size: 1Gi
      storageClass: ""
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

# ── Ingress ─────────────────────────────────────────────────
ingress:
  enabled: true
  className: nginx
  hosts:
    dashboard: dashboard.localtest.me
    api: api.localtest.me
    store: store.localtest.me
  tls: []
