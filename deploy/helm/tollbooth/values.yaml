# ─────────────────────────────────────────────────────────────
# Tollbooth – Default Values
# ─────────────────────────────────────────────────────────────
# These are base defaults. Override with values-local.yaml or
# values-prod.yaml for environment-specific settings.

global:
  namespace: tollbooth
  imagePullPolicy: IfNotPresent

# ── Gateway ─────────────────────────────────────────────────
gateway:
  enabled: true
  replicaCount: 1
  image:
    repository: tollbooth/gateway
    tag: dev
  port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  env: {}

# ── woo-mcp ────────────────────────────────────────────────
woo-mcp:
  enabled: true
  replicaCount: 1
  image:
    repository: tollbooth/woo-mcp
    tag: dev
  port: 8081
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  env: {}

# ── Dashboard ───────────────────────────────────────────────
dashboard:
  enabled: true
  replicaCount: 1
  image:
    repository: tollbooth/dashboard
    tag: dev
  port: 8080
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# ── PostgreSQL ──────────────────────────────────────────────
postgres:
  enabled: true
  image:
    repository: postgres
    tag: "16-alpine"
  port: 5432
  storage:
    size: 1Gi
    storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# ── Store (WordPress + MariaDB) ────────────────────────────
store:
  enabled: false  # disabled by default, enable per-environment
  ingress:
    enabled: false  # umbrella ingress handles routing when enabled under umbrella
    host: store.127.0.0.1.nip.io
  wordpress:
    image:
      repository: wordpress
      tag: "6.7-php8.2-apache"
    port: 80
    storage:
      size: 2Gi
      storageClass: ""
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    existingSecret: "mariadb-credentials"
    adminExistingSecret: "wordpress-admin-credentials"
  mariadb:
    image:
      repository: mariadb
      tag: "11.4"
    port: 3306
    storage:
      size: 2Gi
      storageClass: ""
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    existingSecret: "mariadb-credentials"
  bootstrap:
    enabled: true
    image:
      repository: wordpress
      tag: "cli"
    apiKeysExistingSecret: "woocommerce-api-keys"
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

# ── Ingress ─────────────────────────────────────────────────
ingress:
  enabled: true
  className: nginx
  hosts:
    dashboard: dashboard.127.0.0.1.nip.io
    gateway: gateway.127.0.0.1.nip.io
    api: api.127.0.0.1.nip.io
    store: store.127.0.0.1.nip.io
  tls: []
