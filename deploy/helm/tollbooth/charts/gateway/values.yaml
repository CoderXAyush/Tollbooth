replicaCount: 1

image:
  repository: tollbooth/gateway
  tag: dev

port: 8080

postgres:
  host: "postgres"
  port: 5432
  existingSecret: "postgres-credentials"

encryptionKeySecret: "gateway-encryption-key"
adminCredentialsSecret: "gateway-admin-credentials"
bootstrapTokenSecret: "gateway-bootstrap-token"
wooAuthSecret: "woo-mcp-auth"

seedWoo:
  enabled: true
  url: "http://woo-mcp:8081/mcp"

networkPolicy:
  enabled: true
  allowExternalEgress: false

ingress:
  enabled: true
  className: nginx
  host: gateway.127.0.0.1.nip.io

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

env: {}