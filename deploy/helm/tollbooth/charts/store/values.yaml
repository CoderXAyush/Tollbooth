# ─────────────────────────────────────────────────────────────
# Store Subchart – Default Values (WordPress + MariaDB + Bootstrap)
# ─────────────────────────────────────────────────────────────
# This chart can be installed standalone or as part of the Tollbooth umbrella chart.

wordpress:
  image:
    repository: wordpress
    tag: "6.7-php8.2-apache"
  imagePullPolicy: IfNotPresent
  port: 80
  storage:
    size: 2Gi
    storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  existingSecret: "mariadb-credentials"
  adminExistingSecret: "wordpress-admin-credentials"

mariadb:
  image:
    repository: mariadb
    tag: "11.4"
  imagePullPolicy: IfNotPresent
  port: 3306
  storage:
    size: 2Gi
    storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  existingSecret: "mariadb-credentials"

bootstrap:
  enabled: true
  image:
    repository: wordpress
    tag: "cli"
  imagePullPolicy: IfNotPresent
  apiKeysExistingSecret: "woocommerce-api-keys"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

ingress:
  enabled: true
  className: nginx
  host: "store.127.0.0.1.nip.io"
  tls: []
