apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-woo-mcp
  labels:
    app.kubernetes.io/name: woo-mcp
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: woo-mcp
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: woo-mcp
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: woo-mcp
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: woo-mcp
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: woo-mcp
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ if and .Values.global .Values.global.imagePullPolicy }}{{ .Values.global.imagePullPolicy }}{{ else }}{{ .Values.imagePullPolicy | default "IfNotPresent" }}{{ end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: {{ .Values.port }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.port | quote }}
            - name: WOO_BASE_URL
              value: "http://{{ .Values.store.host }}:{{ .Values.store.port }}"
            - name: WOO_CONSUMER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.store.apiKeysSecret | default "woocommerce-api-keys" }}
                  key: CONSUMER_KEY
            - name: WOO_CONSUMER_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.store.apiKeysSecret | default "woocommerce-api-keys" }}
                  key: CONSUMER_SECRET
            - name: MCP_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.store.authSecret | default "woo-mcp-auth" }}
                  key: MCP_AUTH_TOKEN
            - name: HTTP_TIMEOUT
              value: {{ .Values.httpTimeout | default "15s" | quote }}
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}
            limits:
              cpu: {{ .Values.resources.limits.cpu }}
              memory: {{ .Values.resources.limits.memory }}
