# ─────────────────────────────────────────────────────────────
# Tollbooth – Local Development Values (kind cluster)
# ─────────────────────────────────────────────────────────────

global:
  namespace: tollbooth
  imagePullPolicy: IfNotPresent

gateway:
  enabled: true
  replicaCount: 1
  image:
    repository: tollbooth/gateway
    tag: dev

woo-mcp:
  enabled: true
  replicaCount: 1
  image:
    repository: tollbooth/woo-mcp
    tag: dev

dashboard:
  enabled: true
  replicaCount: 1
  image:
    repository: tollbooth/dashboard
    tag: dev

postgres:
  enabled: true
  storage:
    size: 1Gi
    storageClass: standard

store:
  enabled: true
  ingress:
    enabled: false
    host: store.127.0.0.1.nip.io
  wordpress:
    storage:
      size: 2Gi
      storageClass: standard
  mariadb:
    storage:
      size: 2Gi
      storageClass: standard

ingress:
  enabled: true
  className: nginx
  hosts:
    dashboard: dashboard.127.0.0.1.nip.io
    gateway: gateway.127.0.0.1.nip.io
    api: api.127.0.0.1.nip.io
    store: store.127.0.0.1.nip.io
  tls: []
